server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — always serve index.html for non-asset routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Internal stack convention: nginx (this container) proxies both /api/* and
    # /mocks/* to the backend container on its internal port.
    # The backend port is 3001 by default and is NOT exposed to the host.
    # If you change the backend PORT via docker-compose (.env), you MUST also
    # update the two `proxy_pass http://backend:3001;` lines below to match.
    # The frontend external port (:8080) is independent and stays configurable
    # via the `8080:80` mapping in docker-compose.yml.

    # Dashboard API → backend container (internal network)
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public mock endpoints → backend container
    location /mocks/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
